version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - ./database/migrations:/docker-entrypoint-initdb.d:Z
    networks:
      - platform_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: platform-keycloak
    restart: unless-stopped
    command: start-dev --http-port 8081
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adminpassword
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/platform_dev
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: devpassword
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_net

  platform-api:
    build:
      context: .
      dockerfile: containers/platform-api.Containerfile
    container_name: platform-api-service
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:devpassword@postgres:5432/platform_dev"
      RUST_LOG: "info,platform_api=debug"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_net

networks:
  platform_net:
    driver: bridge

volumes:
  postgres_data:
